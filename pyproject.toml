[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cluster-rl"
version = "0.1.0"
description = "Real-data RL environment for container placement on a cluster"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "gymnasium>=0.29",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rl = ["stable-baselines3>=2.3", "sb3-contrib>=2.3", "torch>=2.1", "tensorboard>=2.14"]
ui = ["streamlit>=1.30", "plotly>=5.18"]
bq = ["google-cloud-bigquery>=3.0", "db-dtypes>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
